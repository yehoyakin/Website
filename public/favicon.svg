<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Pixel gamepad</title>

  <!-- Blue pixel square: dark border + blue face -->
  <path fill="#0B4A85" d="M5 1h22v1h2v1h1v2h1v22h-1v2h-1v1h-2v1H5v-1H3v-1H2v-2H1V5h1V3h1V2h2z" />
  <path fill="#1E9AEC" d="M6 2h20v1h2v1h1v2h1v20h-1v2h-1v1h-2v1H6v-1H4v-1H3v-2H2V6h1V4h1V3h2z" />

  <!-- Top sheen -->
  <rect x="7" y="3" width="18" height="1" fill="#57C4F6" />
  <rect x="9" y="4" width="13" height="1" fill="#A6E4FB" />

  <!-- Pad silhouette -->
  <g fill="#1C2A3F">
    <rect x="10" y="8" width="12" height="1" />
    <rect x="8" y="9" width="16" height="1" />
    <rect x="7" y="10" width="18" height="1" />
    <rect x="6" y="11" width="20" height="10" />
    <rect x="7" y="21" width="18" height="1" />
    <rect x="9" y="22" width="3" height="1" />
    <rect x="20" y="22" width="3" height="1" />
  </g>

  <!-- Pad body -->
  <g fill="#A8B3C1">
    <rect x="11" y="8" width="10" height="1" />
    <rect x="9" y="9" width="14" height="1" />
    <rect x="8" y="10" width="16" height="1" />
    <rect x="7" y="11" width="18" height="7" />
  </g>
  <g fill="#DCE5EE">
    <rect x="11" y="8" width="10" height="1" />
    <rect x="9" y="9" width="14" height="1" />
    <rect x="8" y="10" width="16" height="1" />
  </g>
  <rect x="7" y="18" width="18" height="1" fill="#8C99A9" />
  <rect x="7" y="19" width="18" height="2" fill="#24324A" />

  <!-- D-pad -->
  <g fill="#1C2A3F">
    <rect x="10" y="11" width="4" height="8" />
    <rect x="8" y="13" width="8" height="4" />
  </g>
  <g fill="#EAF1F7">
    <rect x="11" y="12" width="2" height="6" />
    <rect x="9" y="14" width="6" height="2" />
  </g>

  <!-- Buttons -->
  <g fill="#3E4E66">
    <rect x="18" y="9" width="2" height="1" />
    <rect x="17" y="10" width="4" height="1" />
    <rect x="16" y="11" width="6" height="2" />
    <rect x="17" y="13" width="4" height="1" />
    <rect x="18" y="14" width="2" height="1" />

    <rect x="21" y="13" width="2" height="1" />
    <rect x="20" y="14" width="4" height="1" />
    <rect x="19" y="15" width="6" height="2" />
    <rect x="20" y="17" width="4" height="1" />
    <rect x="21" y="18" width="2" height="1" />
  </g>
  <g fill="#EAF1F7">
    <rect x="17" y="10" width="4" height="4" />
    <rect x="20" y="14" width="4" height="4" />
  </g>
  <g fill="#3C4E66">
    <rect x="18" y="11" width="2" height="2" />
    <rect x="21" y="15" width="2" height="2" />
  </g>
</svg>
